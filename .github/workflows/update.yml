name: Auto Update Cakhia Playlist

on:
  schedule:
    - cron: '0 */1 * * *' # Chạy tự động mỗi 1 tiếng
  workflow_dispatch: # Nút chạy thủ công

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền ghi đè file m3u vào repo
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run Converter Script
        run: python convert.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add cakhiatv.m3u
          # Chỉ commit nếu có thay đổi
          git commit -m "Auto-update playlist: $(date)" || exit 0
          git push
